global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: codeorigin-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["codeorigin-gateway:8200"]
  - job_name: codeorigin-eval
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["codeorigin-eval:8205"]
