# Dev override: mock LLM + hash embedder + in-memory store (no GPU, no model downloads),
# every service port published for debugging, and the Vite dev server with hot reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  web:
    image: codeorigin/web:dev-hot
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/frontend/src:/app/src
    environment:
      GATEWAY_URL: http://codeorigin-gateway:8200
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5180/ >/dev/null || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s
  gateway:
    environment: { ALLOW_LOCAL_REPOS: "1" }
  ingest:
    ports: ["8201:8201"]
    environment: { ALLOW_LOCAL_REPOS: "1" }
  rag:
    build:
      args: { EMBEDDING_BACKEND: hash }
    image: codeorigin/rag:dev-hash
    ports: ["8202:8202"]
    environment: { EMBEDDING_BACKEND: hash, STORE_BACKEND: memory }
  llm:
    ports: ["8203:8203"]
    environment: { MOCK_LLM: "1" }
  orchestrator:
    ports: ["8204:8204"]
  eval:
    ports: ["8205:8205"]
