name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read, packages: write }

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, context: services/frontend }
          - { name: gateway, context: services/gateway }
          - { name: ingest, context: services/ingest }
          - { name: rag, context: services/rag }
          - { name: llm, context: services/llm }
          - { name: orchestrator, context: services/orchestrator }
          - { name: eval, context: services/eval }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/codeorigin-${{ matrix.name }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: scan:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: trivy image scan (blocks the release on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "scan:${{ matrix.name }}", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}

  github-release:
    needs: images
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
